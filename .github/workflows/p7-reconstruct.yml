name: Diagnose P7.0 payload stream

on:
  push:
    branches:
      - repair/p7-0-source-tree
    paths:
      - .github/workflows/p7-reconstruct.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Compare staged payload streams
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/p7-0/part-*.b64 | tr -d '\r\n\t ' > "$RUNNER_TEMP/parts.b64"
          cat .bootstrap/probe-0{0,1,2,3,4}.b64 | tr -d '\r\n\t ' > "$RUNNER_TEMP/probe.b64"
          PARTS="$RUNNER_TEMP/parts.b64" PROBE="$RUNNER_TEMP/probe.b64" python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ['PARTS']).read_text()
          q = Path(os.environ['PROBE']).read_text()
          n = min(len(p), len(q))
          lcp = 0
          while lcp < n and p[lcp] == q[lcp]:
              lcp += 1
          print('parts_chars=', len(p))
          print('probe_chars=', len(q))
          print('longest_common_prefix=', lcp)
          print('parts_near_lcp=', p[max(0,lcp-24):lcp+48])
          print('probe_near_lcp=', q[max(0,lcp-24):lcp+48])
          for i in range(5):
              chunk = Path(f'.bootstrap/probe-{i:02d}.b64').read_text().replace('\n','').replace('\r','').replace('\t','').replace(' ','')
              print(f'probe_{i:02d}_chars=', len(chunk), 'position_in_parts=', p.find(chunk))
          PY

          base64 --decode "$RUNNER_TEMP/parts.b64" > "$RUNNER_TEMP/parts.xz"
          echo "parts_decoded_bytes=$(wc -c < "$RUNNER_TEMP/parts.xz")"
          sha256sum "$RUNNER_TEMP/parts.xz"
          if xz --test "$RUNNER_TEMP/parts.xz"; then
            echo 'PARTS_XZ_OK=1'
          else
            echo 'PARTS_XZ_OK=0'
          fi

          if base64 --decode "$RUNNER_TEMP/probe.b64" > "$RUNNER_TEMP/probe.xz"; then
            echo "probe_decoded_bytes=$(wc -c < "$RUNNER_TEMP/probe.xz")"
            sha256sum "$RUNNER_TEMP/probe.xz"
            if xz --test "$RUNNER_TEMP/probe.xz"; then
              echo 'PROBE_XZ_OK=1'
            else
              echo 'PROBE_XZ_OK=0'
            fi
          else
            echo 'PROBE_BASE64_OK=0'
          fi
