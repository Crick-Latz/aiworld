name: Validate P7.1A material request foundation

on:
  push:
    branches:
      - work/p7-1-material-request
    paths:
      - .github/workflows/p7-1-validate.yml

permissions:
  contents: write

concurrency:
  group: p7-1-foundation-validator
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.head_commit.message == 'chore(ci): stage P7.1 validator'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out material request branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bring branch onto the current P7.0 mainline and harden invalid-response handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          test -f game/test/p7_information_subgoal.gd
          test -f game/src/simulation/information/information_subgoal_tracker.gd

          python3 - <<'PY'
          from pathlib import Path
          import re

          tracker = Path('game/src/simulation/material_request/material_request_tracker.gd')
          text = tracker.read_text(encoding='utf-8')
          replacement = '''func record_response(
          \trequest_id: String,
          \tresponder_id: String,
          \toutcome: String,
          \ttick: int,
          \taccepted_quantity: int = 0,
          \treason: String = "",
          \tcounter: Dictionary = {}
          ) -> bool:
          \tif not _requests.has(request_id):
          \t\treturn false
          \tvar request: Dictionary = _requests[request_id]
          \tif String(request.get("status", "")) != Contract.STATUS_WAITING_RESPONSE:
          \t\treturn false
          \tif responder_id != String(request.get("target_id", "")):
          \t\treturn false
          \tif outcome not in [Contract.OUTCOME_ACCEPT, Contract.OUTCOME_REFUSE, Contract.OUTCOME_COUNTER, Contract.OUTCOME_UNKNOWN]:
          \t\treturn false

          \tvar resolved_quantity := 0
          \tif outcome == Contract.OUTCOME_ACCEPT:
          \t\tvar requested := int(request.get("requested_quantity", 0))
          \t\tresolved_quantity = accepted_quantity if accepted_quantity > 0 else requested
          \t\tif resolved_quantity <= 0 or resolved_quantity > requested:
          \t\t\treturn false
          \telif outcome == Contract.OUTCOME_COUNTER:
          \t\tresolved_quantity = int(counter.get("quantity", accepted_quantity))
          \t\tif resolved_quantity <= 0 or resolved_quantity > int(request.get("requested_quantity", 0)):
          \t\t\treturn false

          \trequest["response_outcome"] = outcome
          \trequest["response_reason"] = reason
          \trequest["updated_tick"] = tick
          \trequest["last_counter"] = counter.duplicate(true)

          \tmatch outcome:
          \t\tContract.OUTCOME_ACCEPT:
          \t\t\trequest["accepted_quantity"] = resolved_quantity
          \t\t\trequest["status"] = Contract.STATUS_WAITING_TRANSFER
          \t\tContract.OUTCOME_COUNTER:
          \t\t\trequest["accepted_quantity"] = resolved_quantity
          \t\t\trequest["status"] = Contract.STATUS_WAITING_REQUESTER
          \t\tContract.OUTCOME_REFUSE, Contract.OUTCOME_UNKNOWN:
          \t\t\trequest["accepted_quantity"] = 0
          \t\t\trequest["status"] = Contract.STATUS_ACTIVE

          \t_append_history(request, "RESPONSE_RECORDED", tick, {
          \t\t"responder_id": responder_id,
          \t\t"outcome": outcome,
          \t\t"accepted_quantity": int(request.get("accepted_quantity", 0)),
          \t\t"reason": reason,
          \t\t"counter": counter.duplicate(true),
          \t})
          \t_requests[request_id] = request
          \treturn true

          func accept_counter'''
          updated, count = re.subn(
              r'func record_response\([\s\S]*?\nfunc accept_counter',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('record_response replacement did not match exactly once')
          tracker.write_text(updated, encoding='utf-8')

          policy = Path('game/src/simulation/material_request/material_request_policy.gd')
          ptext = policy.read_text(encoding='utf-8')
          old = '\t\tif not raw_candidate is Dictionary:'
          new = '\t\tif not (raw_candidate is Dictionary):'
          if old not in ptext:
              raise SystemExit('subjective candidate type guard not found')
          policy.write_text(ptext.replace(old, new, 1), encoding='utf-8')

          test = Path('game/test/p7_1_material_request.gd')
          ttext = test.read_text(encoding='utf-8')
          anchor = '\t_assert_false(tracker.record_response("req-1", "wrong-actor", Contract.OUTCOME_ACCEPT, 13, 2), "wrong responder cannot answer")\n'
          addition = anchor + '''\t_assert_false(tracker.record_response("req-1", "actor-holder", Contract.OUTCOME_ACCEPT, 13, 3), "accepted quantity cannot exceed request")
          \t_assert_eq(String(tracker.get_request("req-1").get("status", "")), Contract.STATUS_WAITING_RESPONSE, "invalid response preserves waiting state")
          \t_assert_eq(String(tracker.get_request("req-1").get("response_outcome", "")), "", "invalid response leaves outcome untouched")
          '''
          if anchor not in ttext:
              raise SystemExit('invalid response test insertion anchor not found')
          test.write_text(ttext.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Install checksum-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiworld-godot" .tmp/ci/p7-1-validator
          archive="$RUNNER_TEMP/aiworld-godot/engine.zip"
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            --output "$archive"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  '"$archive" | sha256sum -c -
          unzip -q "$archive" 'Godot_v4.7.2-stable_linux.x86_64' -d "$RUNNER_TEMP/aiworld-godot"
          engine="$RUNNER_TEMP/aiworld-godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$engine"
          test "$("$engine" --version)" = '4.7.2.stable.official.ed1daf0bf'
          echo "GODOT_BIN=$engine" >> "$GITHUB_ENV"

      - name: Dedicated P7.1A regression
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path game --script res://test/p7_1_material_request.gd 2>&1 | tee .tmp/ci/p7-1-validator/material-request.log
          grep -Eq 'SUMMARY: passed=[1-9][0-9]* failed=0' .tmp/ci/p7-1-validator/material-request.log

      - name: Full strict regression
        run: python3 scripts/run-strict-regression.py --evidence .tmp/ci/p7-1-validator/strict

      - name: Stable framework deterministic replay
        run: python3 scripts/run-simulation.py --profile framework --seed 61000 --ticks 1000 --verify-replay --out .tmp/ci/p7-1-validator/framework-61000.json

      - name: P7.0 information deterministic replay
        run: python3 scripts/run-simulation.py --profile information --seed 61003 --ticks 1000 --verify-replay --out .tmp/ci/p7-1-validator/information-61003.json

      - name: Publish only the validated branch state
        shell: bash
        run: |
          set -euo pipefail
          git add game/src/simulation/material_request/material_request_tracker.gd \
                  game/src/simulation/material_request/material_request_policy.gd \
                  game/test/p7_1_material_request.gd
          if ! git diff --cached --quiet; then
            git commit -m 'fix(p7.1): preserve request state on invalid responses'
          fi
          git push origin HEAD:work/p7-1-material-request

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-1-validator-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci/p7-1-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
