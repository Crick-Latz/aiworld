name: P7.1 runtime probe
on:
  push:
    branches: [work/p7-1-runtime-v2]
    paths:
      - .github/workflows/p7-1-runtime-probe.yml
      - game/src/simulation/material_request/**
      - game/src/simulation/core/island_simulation.gd
      - game/src/simulation/decision/action_registry.gd
      - game/src/simulation/decision/decision_engine.gd
      - game/src/runtime/simulation_bootstrap.gd
      - game/src/runtime/simulation_audit.gd
      - game/config/simulation_profiles.json
      - game/test/p7_1_runtime.gd
      - scripts/run-simulation.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          archive="$RUNNER_TEMP/godot/engine.zip"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' --output "$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum -c -
          unzip -q "$archive" 'Godot_v4.7.2-stable_linux.x86_64' -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Clean editor import
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path game --editor --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Foundation regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path game --script res://test/p7_1_material_request.gd 2>&1 | tee "$RUNNER_TEMP/foundation.log"
          grep -Eq '^SUMMARY: passed=90 failed=0$' "$RUNNER_TEMP/foundation.log"
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/foundation.log"; then exit 1; fi
          "$GODOT_BIN" --headless --path game --script res://test/p7_1_material_request_hardening.gd 2>&1 | tee "$RUNNER_TEMP/hardening.log"
          grep -Eq '^SUMMARY: passed=14 failed=0$' "$RUNNER_TEMP/hardening.log"
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/hardening.log"; then exit 1; fi
      - name: Runtime regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path game --script res://test/p7_1_runtime.gd 2>&1 | tee "$RUNNER_TEMP/runtime.log"
          grep -Eq '^SUMMARY: passed=30 failed=0$' "$RUNNER_TEMP/runtime.log"
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/runtime.log"; then exit 1; fi
      - name: Module boundaries
        run: node scripts/check-module-boundaries.mjs
      - name: Material deterministic replay smoke
        run: python3 scripts/run-simulation.py --profile material --seed 61007 --ticks 300 --verify-replay --out "$RUNNER_TEMP/material-61007.json"
