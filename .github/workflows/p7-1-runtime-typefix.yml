name: Repair P7.1 runtime type inference
on:
  push:
    branches: [work/p7-1-runtime-v2]
    paths: [.github/workflows/p7-1-runtime-typefix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true
      - name: Add explicit Godot types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game/src/simulation/core/island_simulation.gd')
          text = p.read_text(encoding='utf-8')
          old = 'var active := _material_request_coordinator_state.tracker.active_requests_for(actor_id)'
          if text.count(old) != 1: raise SystemExit('active anchor mismatch')
          text = text.replace(old, 'var active: Array = _material_request_coordinator_state.tracker.active_requests_for(actor_id)', 1)
          old2 = 'var request := _material_request_coordinator_state.tracker.get_request(request_id)'
          if text.count(old2) != 2: raise SystemExit(f'request anchor mismatch: {text.count(old2)}')
          text = text.replace(old2, 'var request: Dictionary = _material_request_coordinator_state.tracker.get_request(request_id)')
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/p7-1-runtime-typefix.yml').unlink()
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'aiworld-ci'
          git config user.email 'aiworld-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p7.1b): make runtime state types explicit'
          git push origin HEAD:work/p7-1-runtime-v2
