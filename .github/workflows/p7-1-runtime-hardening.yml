name: Harden P7.1 runtime adapter
on:
  push:
    branches: [work/p7-1-runtime-v2]
    paths: [.github/workflows/p7-1-runtime-hardening.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true
      - name: Patch runtime adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game/src/simulation/material_request/material_request_runtime_adapter.gd')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const REQUEST_TTL_TICKS := 24\n', 'const REQUEST_TTL_TICKS := 24\nconst RETRY_COOLDOWN_TICKS := 6\n', 1)
          old = '\tcoordinator.tracker.expire_due(now_tick)\n\tvar active: Array = coordinator.tracker.active_requests_for(actor_id)'
          new = '''\tvar expired: Array = coordinator.tracker.expire_due(now_tick)\n\tfor raw_expired in expired:\n\t\tif raw_expired is Dictionary and String(raw_expired.get("requester_id", "")) == actor_id:\n\t\t\tactor["material_request_cooldown_until"] = maxi(int(actor.get("material_request_cooldown_until", 0)), now_tick + RETRY_COOLDOWN_TICKS)\n\tif now_tick < int(actor.get("material_request_cooldown_until", 0)):\n\t\treturn {}\n\tvar active: Array = coordinator.tracker.active_requests_for(actor_id)'''
          if old not in s: raise SystemExit('prepare anchor missing')
          s = s.replace(old, new, 1)
          replacements = {
              'var blocker := _select_material_blocker(proposals)': 'var blocker: Dictionary = _select_material_blocker(proposals)',
              'var request_id := "MR:%s:%s:%s" % [actor_id, plan_id, item_id]': 'var request_id := "MR:%s:%s:%s:%d" % [actor_id, plan_id, item_id, now_tick]',
              'var existing := coordinator.tracker.get_request(request_id)': 'var existing: Dictionary = coordinator.tracker.get_request(request_id)',
              'var request := Contract.make_request(request_id, actor_id, item_id, quantity, root_goal,': 'var request: Dictionary = Contract.make_request(request_id, actor_id, item_id, quantity, root_goal,',
              'var preview_state := _runtime_state(request, actor, relationships, coordinator, now_tick, seed)': 'var preview_state: Dictionary = _runtime_state(request, actor, relationships, coordinator, now_tick, seed)',
              'var excluded := _answered_targets(request)': 'var excluded: Array = _answered_targets(request)',
              'var beliefs := HolderBeliefs.candidates(actor, String(request.get("item_id", "")), visible,': 'var beliefs: Array = HolderBeliefs.candidates(actor, String(request.get("item_id", "")), visible,',
              'var row := blocker.duplicate(true)': 'var row: Dictionary = blocker.duplicate(true)',
          }
          for old_text, new_text in replacements.items():
              if s.count(old_text) != 1:
                  raise SystemExit(f'anchor count {s.count(old_text)} for {old_text}')
              s = s.replace(old_text, new_text, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/p7-1-runtime-hardening.yml').unlink()
          PY
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name 'aiworld-ci'
          git config user.email 'aiworld-ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p7.1b): harden retry lifecycle and runtime types'
          git push origin HEAD:work/p7-1-runtime-v2
