name: Bootstrap AIWorld source

on:
  push:
    branches:
      - bootstrap/p6-4-local-integrated
    paths:
      - .bootstrap/AIWorld_P6_4_LOCAL_INTEGRATED_SOURCE.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract the Codex-integrated source
        shell: bash
        run: |
          set -euo pipefail
          archive=.bootstrap/AIWorld_P6_4_LOCAL_INTEGRATED_SOURCE.zip
          echo "cc04d2c4d05808a27b85ef469b5c680d47c9e8d4a533baba59440cab39b77578  ${archive}" | sha256sum -c -
          rm -rf /tmp/aiworld-import
          mkdir -p /tmp/aiworld-import
          unzip -q "${archive}" -d /tmp/aiworld-import
          test -f /tmp/aiworld-import/source_stage/game/project.godot
          test -f /tmp/aiworld-import/source_stage/docs/handoff/P6_4_LOCAL_INTEGRATION_REPORT.md

      - name: Replace the bootstrap files with the source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a /tmp/aiworld-import/source_stage/. .
          rm -f .github/workflows/bootstrap-import.yml
          find .github -depth -type d -empty -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import AIWorld P6.4 local integrated baseline"
          git push origin HEAD:bootstrap/p6-4-local-integrated
