name: Gate P7.1A review readiness

on:
  push:
    branches:
      - work/p7-1-material-request
    paths:
      - .github/workflows/p7-1-review-gate.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: p7-1-review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.head_commit.message == 'chore(ci): stage P7.1 review gate'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PR_NUMBER: '3'
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify required source layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ci/p7-1-review
          git rev-parse HEAD | tee .tmp/ci/p7-1-review/tested-commit.txt
          test -f game/test/p7_information_subgoal.gd
          test -f game/src/simulation/information/information_subgoal_tracker.gd
          test -f game/src/simulation/material_request/material_request_contract.gd
          test -f game/src/simulation/material_request/material_request_tracker.gd
          test -f game/src/simulation/material_request/material_request_policy.gd
          test -f game/src/simulation/material_request/material_request_response_policy.gd
          test -f game/src/simulation/material_request/material_transfer_service.gd
          test -f game/src/simulation/material_request/material_request_coordinator.gd
          test -f game/test/p7_1_material_request.gd

      - name: Install checksum-pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiworld-godot"
          archive="$RUNNER_TEMP/aiworld-godot/engine.zip"
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            --output "$archive"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  '"$archive" | sha256sum -c -
          unzip -q "$archive" 'Godot_v4.7.2-stable_linux.x86_64' -d "$RUNNER_TEMP/aiworld-godot"
          engine="$RUNNER_TEMP/aiworld-godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$engine"
          test "$("$engine" --version)" = '4.7.2.stable.official.ed1daf0bf'
          echo "GODOT_BIN=$engine" >> "$GITHUB_ENV"
          "$engine" --version | tee .tmp/ci/p7-1-review/godot-version.txt

      - name: Dedicated material-request regression
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path game --script res://test/p7_1_material_request.gd 2>&1 | tee .tmp/ci/p7-1-review/material-request.log
          grep -Eq 'SUMMARY: passed=[1-9][0-9]* failed=0' .tmp/ci/p7-1-review/material-request.log

      - name: Full strict regression
        run: python3 scripts/run-strict-regression.py --evidence .tmp/ci/p7-1-review/strict

      - name: Stable framework deterministic replay
        run: python3 scripts/run-simulation.py --profile framework --seed 61000 --ticks 1000 --verify-replay --out .tmp/ci/p7-1-review/framework-61000.json

      - name: P7.0 information deterministic replay
        run: python3 scripts/run-simulation.py --profile information --seed 61003 --ticks 1000 --verify-replay --out .tmp/ci/p7-1-review/information-61003.json

      - name: Mark PR ready and publish validation summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          pr=$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls/${PR_NUMBER}")
          node_id=$(jq -r '.node_id' <<<"${pr}")
          draft=$(jq -r '.draft' <<<"${pr}")
          if [[ "${draft}" = 'true' ]]; then
            graphql=$(jq -n --arg id "${node_id}" '{query:"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}",variables:{id:$id}}')
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Content-Type: application/json' https://api.github.com/graphql -d "${graphql}" | jq -e '.data.markPullRequestReadyForReview.pullRequest.isDraft == false' > /dev/null
          fi
          summary=$(cat <<EOF
          P7.1A review gate passed for commit ${GITHUB_SHA}.

          Verified with checksum-pinned Godot 4.7.2:
          - dedicated material-request regression
          - full strict regression
          - stable framework deterministic replay, seed 61000, 1000 ticks
          - P7.0 information deterministic replay, seed 61003, 1000 ticks

          This checkpoint remains the request foundation. Runtime integration is scheduled for P7.1B.
          EOF
          )
          payload=$(jq -n --arg body "${summary}" '{body:$body}')
          curl --fail --silent --show-error -X POST "${auth[@]}" "${api}/issues/${PR_NUMBER}/comments" -d "${payload}" > /dev/null

      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-1-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci/p7-1-review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
